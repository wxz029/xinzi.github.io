<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#174a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日页计划">
<title>日页计划 · Dayleaf</title>
<link rel="manifest" href="./manifest.webmanifest?v=3">
<link rel="icon" href="./icon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg?v=3">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#174a3e}body{display:grid;place-items:center;min-height:100vh;color:#eaf3ed;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.load{text-align:center;animation:p 1.4s ease-in-out infinite}.sprout{font-size:48px;display:block;margin-bottom:14px}.load strong{display:block;font-family:Georgia,"Songti SC",serif;font-size:22px}.load small{display:block;margin-top:8px;opacity:.65;line-height:1.6}@keyframes p{50%{opacity:.55;transform:translateY(-2px)}}
</style>
</head>
<body>
<div class="load" id="loading"><span class="sprout">♧</span><strong>日页正在生长</strong><small>正在打开你的森林…</small></div>
<script>
(async()=>{try{
const paths=Array.from({length:8},(_,i)=>`./payload/${String(i+1).padStart(2,'0')}.txt`);
const parts=await Promise.all(paths.map(path=>fetch(path).then(response=>{if(!response.ok)throw new Error(`Missing ${path}`);return response.text()})));
const b64=parts.join('').replace(/\s/g,'');
const bytes=Uint8Array.from(atob(b64),char=>char.charCodeAt(0));
const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
const html=await new Response(stream).text();
document.open();document.write(html);document.close();
}catch(error){console.error(error);document.getElementById('loading').innerHTML='<strong>森林暂时没有打开</strong><small>请联网后刷新一次；仍未打开时，请在 Safari 中重新进入。</small>'}
})();
</script>
</body>
</html>
